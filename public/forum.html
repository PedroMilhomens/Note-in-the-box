<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Fórum - Note in the box</title>
  <link rel="stylesheet" href="/css/notes.css">
  <link rel="stylesheet" href="/css/forum.css">
  <script type="module" src="/js/forum.js"></script>
</head>
<body>
  <main class="page">
    <header class="page-header">
      <a class="brand" href="/notes.html">Anotações</a>
      <h1>Fórum da classe</h1>
      <p>Discuta a matéria com sua classe. Evite publicar dados sensíveis, provas ou material protegido.</p>
    </header>

    <p id="feedback" class="feedback" role="status" aria-live="polite"></p>

    <section class="selection panel" aria-label="Selecionar classe">
      <label for="class-select">Classe</label>
      <select id="class-select"></select>
      <span id="class-name" class="class-name"></span>
    </section>

    <section class="panel class-rules" aria-labelledby="rules-title">
      <h2 id="rules-title">Regras da classe</h2>
      <p id="rules-view" class="preformatted"></p>
      <form id="rules-form" class="forum-form" hidden>
        <label for="rules-input">Editar regras (até 5000 caracteres)</label>
        <textarea id="rules-input" rows="4" maxlength="5000"></textarea>
        <button type="submit">Salvar regras</button>
      </form>
    </section>

    <div class="forum-layout">
      <section class="panel topics-panel" aria-labelledby="topics-title">
        <h2 id="topics-title">Tópicos</h2>
        <ul id="topics-list" class="note-list"></ul>

        <form id="topic-form" class="forum-form">
          <h3>Novo tópico</h3>
          <label for="topic-title">Título</label>
          <input id="topic-title" maxlength="200" required>
          <label for="topic-body">Descrição</label>
          <textarea id="topic-body" rows="5" maxlength="20000" required></textarea>
          <label for="topic-note">Referenciar nota (opcional)</label>
          <select id="topic-note"></select>
          <button type="submit">Publicar tópico</button>
        </form>
      </section>

      <section class="panel discussion-panel" aria-labelledby="discussion-title">
        <h2 id="discussion-title">Discussão</h2>
        <p id="topic-placeholder">Selecione um tópico para ler as respostas.</p>
        <article id="topic-detail" hidden>
          <header class="topic-header">
            <h3 id="topic-title-view"></h3>
            <p id="topic-meta" class="topic-meta"></p>
            <p id="topic-body-view" class="preformatted"></p>
            <a id="topic-note-link" hidden></a>
            <div id="topic-actions" class="forum-actions"></div>
          </header>
          <section aria-labelledby="posts-title">
            <h3 id="posts-title">Respostas</h3>
            <ul id="posts-list" class="note-list"></ul>
            <form id="post-form" class="forum-form" hidden>
              <label for="post-body">Sua resposta</label>
              <textarea id="post-body" rows="4" maxlength="20000" required></textarea>
              <button type="submit">Responder</button>
            </form>
          </section>
        </article>
      </section>
    </div>
  </main>
</body>
</html>
